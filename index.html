<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my first webpage</title>
  </head>
  <body>
    <h1 style="">Learning the basis of HTML</h1>
    <p>HTML stands for Hyper text markup language</p>

    <h3>What we can do with HTML</h3>
    <p>
      HTML is a language that can be used to describe the structure of a
      webpage, and a collection of HTML pages gives us a website
    </p>

    <!-- inline styling -->
    <a
      href="about.html"
      style="
        color: white;
        text-decoration: none;
        background-color: indigo;
        padding: 10px;
        border-radius: 10px;
      "
      >Visit my about page</a
    >

    <!-- anchor:     anchor in html is used to create links between webpages -->
    <!-- href: hypertext reference:     is an attribute -->

    <img
      src="img1.jpeg"
      alt="a building"
      width="100px"
      height="100px"
      style="border-radius: 50%"
    />

    <a href="login.html">Login</a>
    <!-- px: stands for pixel -->
    <!-- attribute: are additional information to a tag -->
    <!-- comment:  -->
  </body>
</html>
